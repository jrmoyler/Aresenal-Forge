<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
import {NullEngine,Scene,SceneLoader} from '@babylonjs/core';import '@babylonjs/loaders/glTF';
const engine=new NullEngine();window.checkBabylon=async path=>{const scene=new Scene(engine);try{const result=await SceneLoader.ImportMeshAsync(null,'/',path,scene);const meshes=result.meshes.filter(m=>m.getTotalVertices()>0);if(!meshes.length)throw Error('No geometry');return {meshes:meshes.length,vertices:meshes.reduce((s,m)=>s+m.getTotalVertices(),0),clips:result.animationGroups.map(a=>a.name)};}finally{scene.dispose();}};window.babylonReady=true;
</script></body></html>
